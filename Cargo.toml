[workspace]
members = ["crates/soliton-kernel", "crates/tracker-store"]
resolver = "2"

[package]
license = "Apache-2.0"
name = "soliton"
version = "0.5.30"
edition = "2024"
publish = false

[features]
default = []
bundled-sqlite = ["soliton-kernel/bundled-sqlite", "tracker-store/bundled-sqlite"]

[dependencies]
soliton-kernel = { path = "crates/soliton-kernel" }
tracker-store = { path = "crates/tracker-store" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"

[lints.rust]
unsafe_code = "forbid"
